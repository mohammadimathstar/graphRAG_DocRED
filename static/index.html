<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphRAG Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="chat-container">
        <h2>🤖 GraphRAG Assistant</h2>
        <div class="chat-box" id="chatBox">
            <div class="message bot-msg">Hello! Ask me anything about the knowledge base.</div>
        </div>
        <div class="input-group">
            <input type="text" id="questionInput" placeholder="Ask a question..." onkeypress="handleKeyPress(event)">
            <button id="askBtn" onclick="askQuestion()">Send</button>
        </div>
        
        <!-- Feedback Section -->
        <div class="feedback" id="feedbackBox">
            <strong>Was this answer helpful?</strong><br><br>
            <button class="btn-sm btn-success" id="thumbsUpBtn" onclick="setThumbsUp(true)">👍</button>
            <button class="btn-sm btn-danger" id="thumbsDownBtn" onclick="setThumbsUp(false)">👎</button>
            <br><br>
            <textarea id="feedbackText" placeholder="Optional: Tell us how to improve..." rows="2"></textarea>
            <button class="btn-sm" onclick="submitCombinedFeedback()">Submit Feedback</button>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
